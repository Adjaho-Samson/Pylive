name: Pylive Music APK

on:
  # Toutes les branches : un build est produit dès qu'un commit arrive, ce qui
  # permet aussi de compiler une branche de travail avant fusion.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  # Permet de renvoyer les erreurs de compilation directement dans le journal
  # consultable (les artefacts ne sont pas toujours accessibles depuis un mobile).
  issues: write

concurrency:
  group: pylive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, analyse et APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android requis
        run: |
          # Le runner ubuntu-latest fournit déjà le SDK et les cmdline-tools ;
          # on ajoute uniquement la plateforme et les build-tools nécessaires.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then MANAGER="$(command -v sdkmanager)"; fi
          echo "sdkmanager: $MANAGER"
          yes | "$MANAGER" --licenses > /dev/null 2>&1 || true
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Autoriser le wrapper
        run: chmod +x gradlew

      - name: Contrôles statiques du dépôt
        run: python3 scripts/check_project.py

      - name: Tests unitaires, Lint et APK debug
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Publier les erreurs de compilation
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          {
            echo "### Erreurs de compilation Pylive Music"
            echo ""
            echo '```'
            grep -E "^(e|w): |error:|FAILURE:|What went wrong|Caused by:|> Task .* FAILED" -A 3 gradle-build.log 2>/dev/null | head -200
            echo '```'
          } > rapport-erreurs.md
          gh issue create \
            --title "Build Pylive Music #${{ github.run_number }} : échec" \
            --body-file rapport-erreurs.md || cat rapport-erreurs.md

      - name: Préparer l'APK à distribuer
        run: cp app/build/outputs/apk/debug/app-debug.apk pylive-music.apk

      - name: Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: Pylive-Music-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Rapports et journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pylive-diagnostics
          path: |
            gradle-build.log
            app/build/reports/
            app/build/test-results/
          retention-days: 14

      - name: Publier l'APK dans les releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          # Un APK par build : le tag suit le numéro d'exécution.
          tag_name: apk-${{ github.run_number }}
          name: Pylive Music 1.0.${{ github.run_number }}
          body: |
            APK debug signé pour l'installation directe sur Android 8.0 (API 26) et supérieur.

            `pylive-music.apk` est le fichier à installer sur le téléphone.
            Aucune permission Internet, aucun compte, aucune publicité.
          files: pylive-music.apk
          fail_on_unmatched_files: true

  device-tests:
    name: Tests instrumentés (émulateur)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android requis
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then MANAGER="$(command -v sdkmanager)"; fi
          yes | "$MANAGER" --licenses > /dev/null 2>&1 || true
          "$MANAGER" --install "platforms;android-33" "build-tools;33.0.2" "platform-tools" "emulator"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pylive-instrumentation
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
