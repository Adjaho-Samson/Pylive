name: Pylive Music APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pylive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, analyse et APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Installer le SDK requis
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Autoriser le wrapper
        run: chmod +x gradlew

      - name: Contrôles statiques du dépôt
        run: python3 scripts/check_project.py

      - name: Tests unitaires, Lint et APK debug
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: Pylive-Music-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Rapports et journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pylive-diagnostics
          path: |
            gradle-build.log
            app/build/reports/
            app/build/test-results/
          retention-days: 14

      - name: Publier l'APK dans les releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pylive Music 1.0.${{ github.run_number }}
          body: |
            APK debug signé pour l'installation directe sur Android 8.0 (API 26) et supérieur.

            `pylive-music-debug.apk` est le fichier à installer sur le téléphone.
            Aucune permission Internet, aucun compte, aucune publicité.
          files: app/build/outputs/apk/debug/app-debug.apk

  device-tests:
    name: Tests instrumentés (émulateur)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pylive-instrumentation
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
