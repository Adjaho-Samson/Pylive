name: Page de téléchargement

# Publie docs/site sur GitHub Pages à chaque évolution de la page.
# Sur une branche de travail, la publication échoue tant que Pages n'est pas
# activé sur main : le job est donc informatif hors de main.
on:
  push:
    paths:
      - "docs/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publier la page de téléchargement
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Le jeton de l'intégration ne peut pas créer le site Pages via l'API :
          # cette option laisse l'action activer Pages automatiquement au premier passage.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

      - id: deployment
        uses: actions/deploy-pages@v4
